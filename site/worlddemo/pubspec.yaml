name: world_demo
description: Visual world demo - a kinematic movement authority (speed-clamped inputs, bounded area) for the in-browser room server. No physics engine; the production physics template uses ReactPhysics3D and is out of this demo's scope.
version: 0.1.0
homepage: https://github.com/HolotypePteLtd/openfire
publish_to: none
environment:
  sdk: ^3.12.0
dependencies:
  protocol:
    path: ../../packages/protocol
  web: ^1.1.1
dev_dependencies:
  test: ^1.25.6
  lints: ^6.0.0
